<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#74202E">
<title>동행 · AI 외국인 생활·행정 도우미</title>
<style>
  /* =========================================================
     동행(同行) — 색 토큰
     뿌리 색은 #74202E(와인) 계열. 스트레스 상황용으로 채도는 낮추고
     여백과 대비를 넉넉하게. 액센트(골드)는 로고/현재단계 딱 한 곳만.
     ========================================================= */
  :root{
    --wine:#74202E;
    --wine-deep:#5A1824;
    --wine-tint:#F7EBED;
    --wine-tint-2:#FCF5F6;
    --paper:#FBF8F6;
    --surface:#FFFFFF;
    --ink:#2A2124;
    --muted:#7C6E6E;
    --line:#ECE1DE;
    --gold:#A9803B;
    --ok:#3E7C5A;
    --radius:16px;
    --radius-sm:11px;
    --shadow:0 1px 2px rgba(42,33,36,.05), 0 6px 20px rgba(90,24,36,.06);
    --tap:48px;
    --font: "Apple SD Gothic Neo","Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:#EDE6E2;
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px;}

  /* 모바일 프레임: 데스크톱에서는 폰처럼 가운데 정렬 */
  .app{
    position:relative;
    max-width:480px;
    min-height:100dvh;
    margin:0 auto;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,.08);
    overflow:hidden;
  }

  /* ---------- 상단 바 ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--wine);
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
    display:flex;align-items:center;gap:10px;
    min-height:56px;
  }
  .topbar .back{
    width:38px;height:38px;border-radius:50%;
    display:none;align-items:center;justify-content:center;
    background:rgba(255,255,255,.12);flex:0 0 auto;
  }
  .topbar.has-back .back{display:flex;}
  .topbar .title{font-size:18px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .title .sub{display:block;font-size:11.5px;font-weight:500;opacity:.72;margin-top:1px;}
  .langbtn{
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.13);color:#fff;
    padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;flex:0 0 auto;
  }
  .langbtn svg{width:15px;height:15px;}

  /* 로고 마크 */
  .mark{width:30px;height:30px;flex:0 0 auto;}

  /* ---------- 본문 ---------- */
  .screen{flex:1;overflow-y:auto;padding:20px 16px 108px;-webkit-overflow-scrolling:touch;}
  .screen.pad-top{padding-top:24px;}

  /* ---------- 하단 고정 툴바 ---------- */
  .toolbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;z-index:20;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:none;
    padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
    box-shadow:0 -6px 24px rgba(90,24,36,.05);
  }
  .toolbar.show{display:flex;}
  .toolbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:8px 4px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:600;
    min-height:var(--tap);
  }
  .toolbar button svg{width:24px;height:24px;stroke-width:1.8;}
  .toolbar button.active{color:var(--wine);background:var(--wine-tint);}

  /* ---------- 공통 요소 ---------- */
  .eyebrow{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px;}
  h1.big{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;line-height:1.25;}
  h2.sec{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:26px 2px 12px;}
  .muted{color:var(--muted);}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* 큰 선택 카드 (기관/상황) */
  .pick{
    width:100%;display:flex;align-items:center;gap:14px;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
    transition:transform .12s ease, border-color .12s ease;
  }
  .pick:active{transform:scale(.985);border-color:var(--wine);}
  .pick .ic{
    width:52px;height:52px;border-radius:14px;flex:0 0 auto;
    background:var(--wine-tint);color:var(--wine);
    display:flex;align-items:center;justify-content:center;
  }
  .pick .ic svg{width:27px;height:27px;stroke-width:1.7;}
  .pick .tx{flex:1;min-width:0;}
  .pick .tx .t{font-size:16.5px;font-weight:700;letter-spacing:-.01em;}
  .pick .tx .d{font-size:13.5px;color:var(--muted);margin-top:3px;}
  .pick .chev{color:#C9BBB6;flex:0 0 auto;}

  /* 버튼 */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--wine);color:#fff;font-size:16px;font-weight:700;
    padding:15px 20px;border-radius:14px;width:100%;min-height:var(--tap);
    transition:background .12s ease, transform .1s ease;
  }
  .btn:active{background:var(--wine-deep);transform:scale(.99);}
  .btn.ghost{background:var(--wine-tint);color:var(--wine);}
  .btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
  .btn:disabled{opacity:.45;pointer-events:none;}
  .btn svg{width:20px;height:20px;}

  /* 알림 배너 */
  .note{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--wine-tint-2);border:1px solid var(--wine-tint);
    border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:#6a4b50;
    margin-top:16px;line-height:1.55;
  }
  .note svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px;color:var(--wine);}

  /* ===================== 언어 선택 화면 ===================== */
  .lang-hero{
    background:var(--wine);color:#fff;
    padding:calc(env(safe-area-inset-top) + 46px) 26px 40px;
    border-bottom-left-radius:30px;border-bottom-right-radius:30px;
  }
  .lang-hero .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:30px;}
  .lang-hero .logo-row .name{font-size:19px;font-weight:800;letter-spacing:.02em;}
  .lang-hero .logo-row .name em{font-style:normal;font-weight:500;opacity:.7;font-size:14px;margin-left:6px;}
  .lang-hero h1{font-size:27px;font-weight:800;line-height:1.3;margin:0;letter-spacing:-.02em;
    opacity:0;transform:translateY(8px);animation:rise .5s .05s ease forwards;}
  .lang-hero .rule{width:44px;height:3px;background:var(--gold);border-radius:2px;margin:16px 0 14px;
    opacity:0;animation:fade .6s .3s ease forwards;}
  .lang-hero p{margin:0;font-size:14.5px;opacity:0;animation:fade .6s .35s ease forwards;line-height:1.6;}
  @keyframes rise{to{opacity:1;transform:none;}}
  @keyframes fade{to{opacity:.88;}}

  .lang-list{padding:22px 16px 40px;}
  .lang-item{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:10px;box-shadow:var(--shadow);
    transition:transform .12s ease,border-color .12s ease;
  }
  .lang-item:active{transform:scale(.985);border-color:var(--wine);}
  .lang-item .native{font-size:17px;font-weight:700;}
  .lang-item .en{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .lang-item .flag{font-size:24px;}

  /* ===================== 흐름(스텝) 화면 ===================== */
  .flow-head{margin-bottom:6px;}
  .flow-head .doc{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px;}
  .flow-head .where{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:5px;}

  .progress-wrap{margin:16px 0 8px;}
  .progress-txt{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:7px;display:flex;justify-content:space-between;}
  .progress-bar{height:7px;background:var(--wine-tint);border-radius:99px;overflow:hidden;}
  .progress-bar i{display:block;height:100%;background:var(--wine);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1);}

  /* 현재 단계 하이라이트 카드 */
  .now-card{
    background:var(--wine);color:#fff;border-radius:var(--radius);padding:18px;
    margin:16px 0;box-shadow:0 8px 24px rgba(90,24,36,.22);
  }
  .now-card .lbl{font-size:12px;font-weight:700;letter-spacing:.04em;color:#F2C9A0;display:flex;align-items:center;gap:6px;}
  .now-card .lbl .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .now-card .st{font-size:20px;font-weight:800;margin:8px 0 6px;letter-spacing:-.01em;}
  .now-card .de{font-size:14.5px;opacity:.9;line-height:1.6;}
  .now-card .metas{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .now-card .metas .chip{background:rgba(255,255,255,.15);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;}
  .now-card .metas .chip b{font-weight:700;color:#F7DFC7;}

  .next-peek{
    display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:8px;
  }
  .next-peek .k{font-size:11.5px;font-weight:700;color:var(--gold);flex:0 0 auto;}
  .next-peek .v{font-size:14px;font-weight:600;flex:1;min-width:0;}
  .next-peek svg{color:#C9BBB6;flex:0 0 auto;}

  .flow-actions{display:flex;gap:10px;margin:14px 0 4px;}
  .flow-actions .btn{width:auto;flex:1;}

  /* 전체 타임라인 */
  .timeline{margin-top:26px;position:relative;padding-left:6px;}
  .tl-item{display:flex;gap:14px;padding-bottom:4px;}
  .tl-rail{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:30px;}
  .tl-node{
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;flex:0 0 auto;border:2px solid var(--line);color:var(--muted);background:var(--surface);
  }
  .tl-line{flex:1;width:2px;background:var(--line);margin:2px 0;min-height:14px;}
  .tl-item:last-child .tl-line{display:none;}
  .tl-body{flex:1;padding:2px 0 22px;}
  .tl-body .t{font-size:15.5px;font-weight:700;letter-spacing:-.01em;}
  .tl-body .d{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.55;}
  .tl-body .metas{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .tl-body .metas .chip{background:var(--wine-tint-2);border:1px solid var(--wine-tint);
    color:#7a5a5f;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;}
  .tl-body .metas .chip b{color:var(--wine);}
  /* 상태별 */
  .tl-item.done .tl-node{background:var(--wine);border-color:var(--wine);color:#fff;}
  .tl-item.current .tl-node{border-color:var(--wine);color:var(--wine);box-shadow:0 0 0 4px var(--wine-tint);}
  .tl-item.current .tl-body .t{color:var(--wine);}
  .tl-item.upcoming{opacity:.72;}

  /* ===================== 통역 화면 ===================== */
  .seg{display:flex;background:var(--wine-tint);border-radius:12px;padding:4px;margin-bottom:16px;}
  .seg button{flex:1;padding:10px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);min-height:44px;}
  .seg button.on{background:var(--surface);color:var(--wine);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .convo{display:flex;flex-direction:column;gap:12px;min-height:120px;margin-bottom:6px;}
  .bubble{max-width:82%;padding:12px 14px;border-radius:16px;font-size:15px;line-height:1.5;}
  .bubble .orig{font-size:12.5px;opacity:.62;margin-top:5px;}
  .bubble.staff{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;}
  .bubble.me{align-self:flex-end;background:var(--wine);color:#fff;border-bottom-right-radius:5px;}
  .bubble.me .orig{opacity:.8;}
  .convo-empty{text-align:center;color:var(--muted);font-size:13.5px;padding:24px 10px;}

  .presets{margin:18px 0 12px;}
  .presets .lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:9px;}
  .preset-chip{
    display:inline-block;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:9px 14px;font-size:14px;margin:0 8px 8px 0;font-weight:500;
  }
  .preset-chip:active{background:var(--wine-tint);border-color:var(--wine);}

  .mic-row{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(to top,var(--paper) 70%,transparent);}
  .mic-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--wine);color:#fff;border-radius:14px;padding:15px;font-size:15.5px;font-weight:700;min-height:var(--tap);
  }
  .mic-btn.rec{background:var(--wine-deep);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(116,32,46,.4);}50%{box-shadow:0 0 0 10px rgba(116,32,46,0);}}
  .mic-btn svg{width:22px;height:22px;}

  /* ===================== 번역 화면 ===================== */
  .tr-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .tr-box .cap{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .tr-box textarea{width:100%;border:none;resize:none;font-family:inherit;font-size:16px;line-height:1.55;color:var(--ink);background:transparent;min-height:84px;}
  .tr-box textarea:focus{outline:none;}
  .tr-out{min-height:84px;font-size:16px;line-height:1.55;white-space:pre-wrap;}
  .tr-out.empty{color:#BCAFAB;}
  .swap-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 12px;font-size:13.5px;font-weight:700;color:var(--muted);}
  .swap-row button{width:40px;height:40px;border-radius:50%;background:var(--wine-tint);color:var(--wine);display:flex;align-items:center;justify-content:center;}

  /* ===================== 촬영 화면 ===================== */
  .scan-drop{
    border:2px dashed var(--line);border-radius:var(--radius);background:var(--surface);
    padding:32px 20px;text-align:center;margin-bottom:14px;
  }
  .scan-drop .ic{width:60px;height:60px;border-radius:16px;background:var(--wine-tint);color:var(--wine);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .scan-drop .ic svg{width:30px;height:30px;}
  .scan-drop .t{font-size:16px;font-weight:700;}
  .scan-drop .d{font-size:13.5px;color:var(--muted);margin-top:5px;}
  .scan-preview{width:100%;border-radius:var(--radius);margin-bottom:14px;border:1px solid var(--line);display:block;}
  .result-block{margin-bottom:12px;}
  .result-block .rl{font-size:12.5px;font-weight:700;color:var(--gold);margin-bottom:6px;}
  .field-row{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
  .field-row:last-child{border-bottom:none;}
  .field-row .fk{flex:0 0 34%;font-size:13.5px;font-weight:700;}
  .field-row .fk .ko{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px;}
  .field-row .fv{flex:1;font-size:13.5px;color:var(--muted);line-height:1.5;}

  .spinner{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- 상단 바 -->
  <header class="topbar" id="topbar">
    <button class="back" id="backBtn" aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="20" height="20"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title" id="topTitle">동행</div>
    <button class="langbtn" id="langBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/></svg>
      <span id="langLabel">한국어</span>
    </button>
  </header>

  <!-- 본문 (JS로 렌더) -->
  <main class="screen" id="screen"></main>

  <!-- 하단 고정 툴바 -->
  <nav class="toolbar" id="toolbar" aria-label="주요 기능">
    <button data-tool="interpret">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 12h8M8 8h5"/><path d="M21 12a8 8 0 01-11.6 7.1L3 21l1.9-6.4A8 8 0 1121 12z"/></svg>
      <span class="tl-label">통역</span>
    </button>
    <button data-tool="translate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5h9M9 3v2c0 4-2.5 7-5 8"/><path d="M6 9c0 2 2 4.5 6 6"/><path d="M13 19l4-9 4 9M14.5 16h5"/></svg>
      <span class="tl-label">번역</span>
    </button>
    <button data-tool="scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="tl-label">촬영</span>
    </button>
  </nav>
</div>

<!-- 언어 선택 시트용 파일 입력(촬영) -->
<input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden">

<script>
/* =========================================================================
   동행(同行) — AI 외국인 생활·행정 보조 웹  (해커톤 프로토타입)

   [B안 / 보안]  API 키는 이 파일에 절대 넣지 마세요.
   - 이 웹은 키를 갖지 않습니다. 실제 AI는 "여러분의 백엔드(프록시)"가 호출합니다.
   - 아래 AI.* 함수만 백엔드 호출로 바꾸고, AI.USE_MOCK = false 로 두면 됩니다.
   - 현재는 USE_MOCK=true 라 키 없이도 데모가 그대로 동작합니다.
   ========================================================================= */

const AI = {
  USE_MOCK: false,                // Cloudflare Pages Functions 사용 (목업 끔)
  BACKEND_BASE: "",               // 같은 도메인의 /api/* 호출 (동일 출처 → CORS 불필요)
  endpoints: {
    translate: "/api/translate",  // 텍스트 번역
    interpret: "/api/interpret",  // 음성인식(STT) + 번역
    ocr:       "/api/ocr"         // 이미지 → 텍스트 + 번역 + 설명 + 다음단계
  },

  // ---- 텍스트 번역 -------------------------------------------------------
  async translate(text, from, to){
    if(this.USE_MOCK) return mockTranslate(text, from, to);
    const r = await fetch(this.BACKEND_BASE + this.endpoints.translate, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text, source: from, target: to })
    });
    if(!r.ok) throw new Error("번역 실패 ("+r.status+"): "+ await readErr(r));
    const data = await r.json();
    return data.translation;
  },

  // ---- (통역) 인식된 텍스트 → 번역 ---------------------------------------
  // 음성인식(STT)은 브라우저 Web Speech API로 처리하고, 그 텍스트를 번역합니다.
  async interpret(text, from, to){
    if(this.USE_MOCK) return mockInterpret(text, from, to);
    const r = await fetch(this.BACKEND_BASE + this.endpoints.interpret, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text, source: from, target: to })
    });
    if(!r.ok) throw new Error("통역 실패 ("+r.status+"): "+ await readErr(r));
    return await r.json();   // { recognized, translation }
  },

  // ---- 서류 이미지 분석 (OCR + 번역 + 설명 + 다음 단계) --------------------
  async ocr(file, lang){
    if(this.USE_MOCK || !file) return mockOCR(file, lang);   // 샘플(파일 없음)은 항상 목업 시연
    const { data, mediaType } = await fileToBase64(file);
    const r = await fetch(this.BACKEND_BASE + this.endpoints.ocr, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ image: data, mediaType, lang })
    });
    if(!r.ok) throw new Error("서류 분석 실패 ("+r.status+"): "+ await readErr(r));
    return await r.json();   // { docName:{..}, fields:[{ko,label:{..},guide:{..}}], next:{instId,sitId,text:{..}} }
  }
};

// 서버 에러 본문에서 메시지 추출
async function readErr(r){
  try{ const j=await r.json(); return j.detail || j.error || ("HTTP "+r.status); }
  catch(e){ try{ return (await r.text()).slice(0,200); }catch(_){ return "HTTP "+r.status; } }
}

// File -> base64 (data URL에서 헤더 분리)
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const s = String(fr.result);
      const comma = s.indexOf(",");
      const meta = s.slice(0, comma);
      const data = s.slice(comma + 1);
      const mt = (meta.match(/data:(.*?);/) || [])[1] || "image/jpeg";
      resolve({ data, mediaType: mt });
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

function mockTranslate(text, from, to){
  return new Promise(res=>{
    setTimeout(()=>{
      const q = text.trim();
      if(!q) return res("");
      // 사전에서 찾기
      for(const row of DICT){
        for(const k of ["ko","en","zh","vi"]){
          if(row[k] && row[k].replace(/[?？.!]/g,"") === q.replace(/[?？.!]/g,"")){
            return res(row[to] || row.en);
          }
        }
      }
      // 미스 → 데모 표기
      res(q + "  —  ["+ (LANGS.find(l=>l.code===to)?.native||to) +" 번역 예시 · 백엔드 연결 시 실제 번역]");
    }, 450);
  });
}

function mockInterpret(text, from, to){
  return new Promise(res=>{
    setTimeout(()=> res({ recognized:text, translation: null }), 700);
  });
}

   상태 & 헬퍼
   ========================================================================= */
const state = {
  lang:"ko",
  view:"lang",         // lang | home | institution | flow | interpret | translate | scan
  instId:null,
  sitId:null,
  step:0,
  interpretDir:"staff",
  convo:[],
  trFrom:"ko", trTo:"en",
  stack:[]             // 뒤로가기용
};

const $ = s => document.querySelector(s);
const L = obj => (obj && (obj[state.lang] ?? obj.en ?? obj.ko)) || "";
// 데모 배너는 목업 모드(백엔드 미연결)일 때만 표시
function demoNote(extraStyle){
  if(!AI.USE_MOCK) return "";
  return `<div class="note"${extraStyle?` style="${extraStyle}"`:""}>${ICONS.info}<div>${esc(L(T.demoNote))}</div></div>`;
}
const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ICONS = {
  passport:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 17h6"/></svg>',
  building:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 21V5l8-3 8 3v16"/><path d="M4 21h16M9 9h.01M15 9h.01M9 13h.01M15 13h.01M10 21v-4h4v4"/></svg>',
  cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M12 10v6M9 13h6M8 6V4h8v2"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0012 0M12 17v4"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v13M4 14l3 3 3-3M17 20V7M14 10l3-3 3 3"/></svg>'
};

/* =========================================================================
   렌더링
   ========================================================================= */
function push(view){ state.stack.push(view); }
function go(view, opts={}){
  if(state.view !== "lang") push(state.view);
  Object.assign(state, opts);
  state.view = view;
  render();
  $("#screen").scrollTop = 0;
}
function back(){
  const prev = state.stack.pop();
  state.view = prev || "home";
  render();
  $("#screen").scrollTop = 0;
}

function render(){
  const topbar = $("#topbar"), toolbar = $("#toolbar");
  const inst = INSTITUTIONS.find(i=>i.id===state.instId);
  const sit = inst?.situations.find(s=>s.id===state.sitId);

  // 상단바/툴바 표시 제어
  if(state.view==="lang"){ topbar.classList.add("hidden"); toolbar.classList.remove("show"); }
  else { topbar.classList.remove("hidden"); toolbar.classList.add("show"); }

  // 뒤로 버튼
  topbar.classList.toggle("has-back", state.view!=="home" && state.view!=="lang");

  // 상단 타이틀
  const titles = {
    home:`동행<span class="sub">${esc(L(T.appSub))}</span>`,
    institution:esc(L(inst?.name)),
    flow:esc(L(sit?.doc)),
    interpret:esc(L(T.interpTitle)),
    translate:esc(L(T.trTitle)),
    scan:esc(L(T.scanTitle))
  };
  $("#topTitle").innerHTML = titles[state.view] || "동행";
  $("#langLabel").textContent = LANGS.find(l=>l.code===state.lang).native;

  // 툴바 active
  toolbar.querySelectorAll("button").forEach(b=>b.classList.toggle("active", b.dataset.tool===state.view));

  const scr = $("#screen");
  scr.className = "screen" + (state.view==="lang"?" pad-top":"");
  if(state.view==="lang") scr.style.padding="0"; else scr.style.padding="";

  const R = {
    lang:renderLang, home:renderHome, institution:renderInstitution,
    flow:renderFlow, interpret:renderInterpret, translate:renderTranslate, scan:renderScan
  };
  scr.innerHTML = (R[state.view]||renderHome)(inst, sit);
  wire(state.view);
}

// ---- 언어 선택 -----------------------------------------------------------
function renderLang(){
  const mark = `<svg class="mark" viewBox="0 0 32 32" fill="none"><path d="M9 22c0-5 3-9 7-9s7 4 7 9" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="8" r="3.4" fill="${'#A9803B'}"/><path d="M6 25h20" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>`;
  const items = LANGS.map(l=>`
    <button class="lang-item" data-lang="${l.code}">
      <div><div class="native">${l.native}</div><div class="en">${l.en}</div></div>
      <div class="flag">${l.flag}</div>
    </button>`).join("");
  return `
    <div class="lang-hero">
      <div class="logo-row">${mark}<div class="name">동행<em>同行</em></div></div>
      <h1>${esc(L(T.selectLang)).replace(/\n/g,"<br>")}</h1>
      <div class="rule"></div>
      <p>Select your language · 언어를 선택하세요<br>选择语言 · Chọn ngôn ngữ</p>
    </div>
    <div class="lang-list">${items}
      ${demoNote("margin-top:18px")}
    </div>`;
}

// ---- 홈(기관 선택) -------------------------------------------------------
function renderHome(){
  const cards = INSTITUTIONS.map(i=>`
    <button class="pick" data-inst="${i.id}">
      <div class="ic">${ICONS[i.icon]}</div>
      <div class="tx"><div class="t">${esc(L(i.name))}</div><div class="d">${esc(L(i.blurb))}</div></div>
      <div class="chev">${ICONS.chev}</div>
    </button>`).join("");
  return `
    <p class="eyebrow">${esc(L(T.whereSub))}</p>
    <h1 class="big">${esc(L(T.where))}</h1>
    ${cards}
    <div class="note">${ICONS.info}<div>${esc(L(T.disclaimer))}</div></div>`;
}

// ---- 기관 → 상황 선택 ----------------------------------------------------
function renderInstitution(inst){
  const cards = inst.situations.map(s=>`
    <button class="pick" data-sit="${s.id}">
      <div class="ic">${ICONS[inst.icon]}</div>
      <div class="tx"><div class="t">${esc(L(s.title))}</div>
        <div class="d">${esc(L(T.step))} 1–${s.steps.length}</div></div>
      <div class="chev">${ICONS.chev}</div>
    </button>`).join("");
  return `
    <p class="eyebrow">${esc(L(inst.blurb))}</p>
    <h1 class="big">${esc(L(T.chooseSit))}</h1>
    ${cards}`;
}

// ---- 흐름(스텝) ----------------------------------------------------------
function renderFlow(inst, sit){
  const steps = sit.steps, n = steps.length;
  const done = state.step >= n;
  const cur = Math.min(state.step, n-1);
  const pct = Math.round((Math.min(state.step,n)/n)*100);

  const metaChips = (meta, dark)=> Object.entries(meta||{}).map(([k,v])=>{
    const label = {cost:T.mCost,method:T.mMethod,time:T.mTime,need:T.mNeed}[k];
    return `<span class="chip"><b>${esc(L(label))}</b> ${esc(L(v))}</span>`;
  }).join("");

  // 완료 화면
  if(done){
    return `
      <div class="flow-head"><div class="where">${ICONS[inst.icon]} ${esc(L(inst.name))}</div>
        <div class="doc">${esc(L(sit.doc))}</div></div>
      <div class="now-card" style="text-align:center">
        <div class="st" style="margin-top:4px">${esc(L(T.allDone))}</div>
      </div>
      <button class="btn ghost" id="restart">${esc(L(T.restart))}</button>
      ${timeline(steps, n, metaChips)}
      <div class="note">${ICONS.info}<div>${esc(L(T.disclaimer))}</div></div>`;
  }

  const nextStep = steps[cur+1];
  return `
    <div class="flow-head"><div class="where">${ICONS[inst.icon]} ${esc(L(inst.name))}</div>
      <div class="doc">${esc(L(sit.doc))}</div></div>

    <div class="progress-wrap">
      <div class="progress-txt"><span>${esc(L(T.step))} ${cur+1} ${esc(L(T.of))} ${n}</span><span>${pct}%</span></div>
      <div class="progress-bar"><i style="width:${pct}%"></i></div>
    </div>

    <div class="now-card">
      <div class="lbl"><span class="dot"></span>${esc(L(T.nowDo))}</div>
      <div class="st">${esc(L(steps[cur].title))}</div>
      <div class="de">${esc(L(steps[cur].detail))}</div>
      ${Object.keys(steps[cur].meta||{}).length?`<div class="metas">${metaChips(steps[cur].meta,true)}</div>`:""}
    </div>

    ${nextStep?`<div class="next-peek"><span class="k">${esc(L(T.nextDo))}</span>
      <span class="v">${esc(L(nextStep.title))}</span>${ICONS.chev}</div>`:""}

    <div class="flow-actions">
      ${cur>0?`<button class="btn line" id="prevStep">${esc(L(T.prev))}</button>`:""}
      <button class="btn" id="nextStep">${esc(L(T.doneNext))} ${ICONS.arrow}</button>
    </div>

    ${timeline(steps, n, metaChips)}
    <div class="note">${ICONS.info}<div>${esc(L(T.disclaimer))}</div></div>`;
}

function timeline(steps, n, metaChips){
  const cur = Math.min(state.step, n-1);
  const rows = steps.map((s,i)=>{
    const cls = state.step>=n ? "done" : (i<cur?"done":(i===cur?"current":"upcoming"));
    const node = (i<cur||state.step>=n)
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="15" height="15"><path d="M5 12l5 5 9-11"/></svg>'
      : (i+1);
    return `
      <div class="tl-item ${cls}">
        <div class="tl-rail"><div class="tl-node">${node}</div><div class="tl-line"></div></div>
        <div class="tl-body">
          <div class="t">${esc(L(s.title))}</div>
          <div class="d">${esc(L(s.detail))}</div>
          ${Object.keys(s.meta||{}).length?`<div class="metas">${metaChips(s.meta)}</div>`:""}
        </div>
      </div>`;
  }).join("");
  return `<div class="timeline">${rows}</div>`;
}

// ---- 통역 ---------------------------------------------------------------
function renderInterpret(){
  const dir = state.interpretDir;
  const bubbles = state.convo.length ? state.convo.map(m=>`
    <div class="bubble ${m.side}">
      <div>${esc(m.show)}</div>${m.orig?`<div class="orig">${esc(m.orig)}</div>`:""}
    </div>`).join("")
    : `<div class="convo-empty">${esc(L(T.convoEmpty)).replace(/\n/g,"<br>")}</div>`;

  const list = dir==="staff" ? PHRASES.staff : PHRASES.me;
  const chips = list.map((p,idx)=>{
    const show = dir==="staff" ? L(p.tr) : p.tr.ko;      // 상대 표시용
    return `<button class="preset-chip" data-preset="${idx}">${esc(dir==="staff"?p.ko:L(p.tr))}</button>`;
  }).join("");

  return `
    <div class="seg">
      <button data-dir="staff" class="${dir==="staff"?"on":""}">${esc(L(T.staffSide))}</button>
      <button data-dir="me" class="${dir==="me"?"on":""}">${esc(L(T.meSide))}</button>
    </div>

    <div class="convo" id="convo">${bubbles}</div>

    <div class="presets">
      <div class="lbl">${esc(L(T.common))} · ${dir==="staff"?"🇰🇷 → "+LANGS.find(l=>l.code===state.lang).native : LANGS.find(l=>l.code===state.lang).native+" → 🇰🇷"}</div>
      ${chips}
    </div>
    ${state.convo.length?`<button class="btn line" id="clearConvo" style="margin-bottom:8px">${esc(L(T.clear))}</button>`:""}

    <div class="mic-row">
      <button class="mic-btn" id="micBtn">${ICONS.mic}<span id="micTxt">${esc(L(T.speak))}</span></button>
    </div>`;
}

// ---- 번역 ---------------------------------------------------------------
function renderTranslate(){
  const fromL = LANGS.find(l=>l.code===state.trFrom), toL = LANGS.find(l=>l.code===state.trTo);
  return `
    <div class="tr-box">
      <div class="cap"><span>${fromL.native}</span></div>
      <textarea id="trInput" placeholder="${esc(L(T.trInput))}" rows="3"></textarea>
    </div>
    <div class="swap-row"><span>${fromL.native}</span>
      <button id="swap" aria-label="swap">${ICONS.swap}</button><span>${toL.native}</span></div>
    <div class="tr-box">
      <div class="cap"><span>${toL.native} · ${esc(L(T.trResult))}</span></div>
      <div class="tr-out empty" id="trOut">—</div>
    </div>
    <button class="btn" id="trBtn">${esc(L(T.trBtn))}</button>
    ${demoNote()}`;
}

// ---- 촬영 ---------------------------------------------------------------
function renderScan(){
  return `
    <div id="scanStart">
      <div class="scan-drop" id="scanDrop">
        <div class="ic">${ICONS.cam}</div>
        <div class="t">${esc(L(T.scanDrop))}</div>
        <div class="d">${esc(L(T.scanDropSub))}</div>
      </div>
      <button class="btn" id="pickFile">${ICONS.cam} ${esc(L(T.scanDrop))}</button>
      <button class="btn ghost" id="sampleBtn" style="margin-top:10px">${esc(L(T.scanSample))}</button>
      ${demoNote()}
    </div>
    <div id="scanResult"></div>`;
}

/* =========================================================================
   이벤트 연결
   ========================================================================= */
function wire(view){
  if(view==="lang"){
    document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{
      state.lang=b.dataset.lang; state.trTo = state.lang==="ko"?"en":state.lang;
      state.stack=[]; go("home");
    });
  }
  if(view==="home"){
    document.querySelectorAll("[data-inst]").forEach(b=>b.onclick=()=>go("institution",{instId:b.dataset.inst}));
  }
  if(view==="institution"){
    document.querySelectorAll("[data-sit]").forEach(b=>b.onclick=()=>go("flow",{sitId:b.dataset.sit, step:0}));
  }
  if(view==="flow"){
    const nx=$("#nextStep"), pv=$("#prevStep"), rs=$("#restart");
    if(nx) nx.onclick=()=>{ state.step++; render(); $("#screen").scrollTop=0; };
    if(pv) pv.onclick=()=>{ state.step=Math.max(0,state.step-1); render(); $("#screen").scrollTop=0; };
    if(rs) rs.onclick=()=>{ state.step=0; render(); $("#screen").scrollTop=0; };
  }
  if(view==="interpret") wireInterpret();
  if(view==="translate") wireTranslate();
  if(view==="scan") wireScan();
}

// 툴바
$("#toolbar").querySelectorAll("[data-tool]").forEach(b=>{
  b.onclick=()=>{ if(state.view===b.dataset.tool) return; go(b.dataset.tool); };
});
$("#backBtn").onclick=back;
$("#langBtn").onclick=()=>{ // 언어 재선택
  const codes=LANGS.map(l=>l.code); const i=codes.indexOf(state.lang);
  state.lang=codes[(i+1)%codes.length]; state.trTo = state.lang==="ko"?"en":state.lang;
  render();
};

// ---- 통역 로직 -----------------------------------------------------------
function wireInterpret(){
  document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{ state.interpretDir=b.dataset.dir; render(); });
  const clear=$("#clearConvo"); if(clear) clear.onclick=()=>{ state.convo=[]; render(); };

  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.preset, dir=state.interpretDir;
    if(dir==="staff"){
      const p=PHRASES.staff[idx];
      state.convo.push({ side:"staff", show:L(p.tr), orig:p.ko });   // 직원 원문(한국어) → 내 언어
    } else {
      const p=PHRASES.me[idx];
      state.convo.push({ side:"me", show:p.tr.ko, orig:L(p.tr) });   // 내 말 → 한국어로 직원에게
    }
    render(); const c=$("#convo"); if(c) c.scrollTop=c.scrollHeight;
  });

  // 음성 입력 (Web Speech API — 지원 안되면 안내)
  const mic=$("#micBtn");
  if(mic) mic.onclick=()=>startSpeech(mic);
}

let recog=null;
function startSpeech(btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const dir=state.interpretDir;
  if(!SR){
    // 목업 fallback: 프리셋 첫 문장을 인식한 것처럼 시연
    const p = dir==="staff"?PHRASES.staff[0]:PHRASES.me[2];
    if(dir==="staff") state.convo.push({side:"staff",show:L(p.tr),orig:p.ko});
    else state.convo.push({side:"me",show:p.tr.ko,orig:L(p.tr)});
    render(); return;
  }
  if(recog){ recog.stop(); return; }
  recog=new SR();
  recog.lang = dir==="staff" ? "ko-KR" : ({en:"en-US",zh:"zh-CN",vi:"vi-VN",ko:"ko-KR"}[state.lang]);
  recog.interimResults=false;
  btn.classList.add("rec"); $("#micTxt").textContent=L(T.listening);
  recog.onresult = async e=>{
    const text=e.results[0][0].transcript;
    const from = dir==="staff"?"ko":state.lang;
    const to   = dir==="staff"?state.lang:"ko";
    let tr;
    try{ tr = await AI.translate(text, from, to); }
    catch(err){ tr = "["+String(err.message||err)+"]"; }
    if(dir==="staff") state.convo.push({side:"staff",show:tr,orig:text});
    else state.convo.push({side:"me",show:tr,orig:text});
    render();
  };
  recog.onerror=()=>{ btn.classList.remove("rec"); $("#micTxt") && ($("#micTxt").textContent=L(T.speak)); recog=null; };
  recog.onend =()=>{ recog=null; const b=$("#micBtn"); if(b){b.classList.remove("rec"); const t=$("#micTxt"); if(t)t.textContent=L(T.speak);} };
  recog.start();
}

// ---- 번역 로직 -----------------------------------------------------------
function wireTranslate(){
  const swap=$("#swap"), btn=$("#trBtn");
  swap.onclick=()=>{ [state.trFrom,state.trTo]=[state.trTo,state.trFrom]; render(); };
  btn.onclick=async ()=>{
    const inp=$("#trInput").value; const out=$("#trOut");
    if(!inp.trim()){ out.textContent="—"; out.classList.add("empty"); return; }
    out.classList.remove("empty"); out.innerHTML=`<span class="muted">…</span>`;
    try{
      const r=await AI.translate(inp, state.trFrom, state.trTo);
      out.textContent=r;
    }catch(err){
      out.innerHTML=`<span style="color:var(--wine);font-weight:600">${esc(String(err.message||err))}</span>`;
    }
  };
}

// ---- 촬영 로직 -----------------------------------------------------------
function wireScan(){
  const fileInput=$("#fileInput");
  const pick=$("#pickFile"), sample=$("#sampleBtn");
  if(pick) pick.onclick=()=>fileInput.click();
  fileInput.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const url=URL.createObjectURL(f); runScan(f, url);
    fileInput.value="";
  };
  if(sample) sample.onclick=()=>runScan(null, null);
}

async function runScan(file, previewUrl){
  $("#scanStart").classList.add("hidden");
  const box=$("#scanResult");
  box.innerHTML = `
    ${previewUrl?`<img class="scan-preview" src="${previewUrl}" alt="">`:""}
    <div class="card" style="padding:24px;text-align:center;display:flex;align-items:center;justify-content:center;gap:12px">
      <div class="spinner" style="border-color:rgba(116,32,46,.25);border-top-color:var(--wine)"></div>
      <span class="muted" style="font-weight:600">${esc(L(T.analyzing))}</span>
    </div>`;
  let res;
  try{
    res = await AI.ocr(file, state.lang);
  }catch(err){
    box.innerHTML = `
      ${previewUrl?`<img class="scan-preview" src="${previewUrl}" alt="">`:""}
      <div class="note">${ICONS.info}<div>${esc(String(err.message||err))}</div></div>
      <button class="btn line" id="rescan" style="margin-top:12px">${esc(L(T.scanAgain))}</button>`;
    $("#rescan").onclick=()=>{ $("#scanResult").innerHTML=""; $("#scanStart").classList.remove("hidden"); };
    return;
  }
  const fields = res.fields.map(f=>`
    <div class="field-row">
      <div class="fk">${esc(L(f.label))}<span class="ko">${esc(f.ko)}</span></div>
      <div class="fv">${esc(L(f.guide))}</div>
    </div>`).join("");

  box.innerHTML = `
    ${previewUrl?`<img class="scan-preview" src="${previewUrl}" alt="">`:""}
    <div class="result-block">
      <div class="rl">${esc(L(T.recognized))}</div>
      <div class="card" style="padding:14px 16px;font-weight:700;font-size:16px">${esc(L(res.docName))}</div>
    </div>
    <div class="result-block">
      <div class="rl">${esc(L(T.howToFill))}</div>
      <div class="card" style="padding:4px 16px">${fields}</div>
    </div>
    <div class="result-block">
      <div class="rl">${esc(L(T.whatsNext))}</div>
      <div class="now-card" style="margin:0">
        <div class="de">${esc(L(res.next.text))}</div>
      </div>
    </div>
    <button class="btn" id="goFlow" style="margin-bottom:10px">${esc(L(T.seeFlow))} ${ICONS.arrow}</button>
    <button class="btn line" id="rescan">${esc(L(T.scanAgain))}</button>`;

  $("#goFlow").onclick=()=>go("flow",{instId:res.next.instId, sitId:res.next.sitId, step:0});
  $("#rescan").onclick=()=>{ $("#scanResult").innerHTML=""; $("#scanStart").classList.remove("hidden"); };
}

/* 시작 */
render();
</script>
